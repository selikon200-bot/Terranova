name: Enable TerraNova Living UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enable-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject living UI assets
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./game/living-planet.css">'
          js='<script src="./game/living-planet.js"></script>'
          if 'game/living-planet.css' not in s:
              s=s.replace('</head>', css+'</head>', 1)
          if 'game/living-planet.js' not in s:
              s=s.replace('</body>', js+'</body>', 1)
          p.write_text(s,encoding='utf-8')
      - name: Commit integration
        run: |
          git config user.name 'TerraNova Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: enable living planet UI'
          git push

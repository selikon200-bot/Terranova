<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TerraNova Web 0.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf6ff;font-family:Arial,sans-serif}#app{max-width:700px;margin:auto;min-height:100vh;padding:14px}
h1{margin:5px 0;font-size:28px}.sub{color:#8fb0c9;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.card{background:#102235;border:1px solid #1e3a52;border-radius:14px;padding:10px;text-align:center}.big{font-size:22px;font-weight:bold}.label{font-size:11px;color:#91abc0}
.planet{height:260px;width:260px;border-radius:50%;margin:18px auto;background:radial-gradient(circle at 35% 30%,#6bd6ff 0 9%,transparent 10%),radial-gradient(circle at 60% 62%,#48a878 0 14%,transparent 15%),radial-gradient(circle at 30% 70%,#388f68 0 10%,transparent 11%),radial-gradient(circle at 65% 30%,#72c47a 0 8%,transparent 9%),radial-gradient(circle at 50% 50%,#1870a0,#0a3658 60%,#041522 75%);box-shadow:0 0 45px #2a9dca88,inset -25px -15px 45px #00101e}
button{width:100%;padding:14px;margin:5px 0;border:0;border-radius:12px;background:#1d8f72;color:white;font-size:16px;font-weight:bold}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.log{background:#081725;border-radius:12px;padding:10px;height:110px;overflow:auto;font-size:12px;color:#b9d2e2}
</style></head><body><div id="app">
<h1>🌍 TerraNova</h1><div class="sub">Web 0.2 — حوّل كوكبًا ميتًا إلى عالم صالح للحياة</div>
<div class="stats"><div class="card"><div id="credits" class="big">1000</div><div class="label">💰 الرصيد</div></div><div class="card"><div id="oxy" class="big">5%</div><div class="label">🫁 الأكسجين</div></div><div class="card"><div id="pop" class="big">10</div><div class="label">👨‍🚀 السكان</div></div></div>
<div class="planet"></div>
<div class="stats"><div class="card"><div id="water" class="big">8%</div><div class="label">💧 المياه</div></div><div class="card"><div id="temp" class="big">-35°C</div><div class="label">🌡️ الحرارة</div></div><div class="card"><div id="power" class="big">50</div><div class="label">⚡ الطاقة</div></div></div>
<div class="row"><button onclick="build('extractor')">💧 مستخرج مياه<br>300 💰</button><button onclick="build('solar')">☀️ محطة شمسية<br>250 💰</button><button onclick="build('greenhouse')">🌱 بيت زراعي<br>450 💰</button><button onclick="build('habitat')">🏠 مستعمرة<br>600 💰</button></div>
<button onclick="advance()">⏩ تسريع دورة الكوكب</button><button onclick="resetGame()" style="background:#713c4a">🔄 بدء لعبة جديدة</button>
<h3>سجل المهمة</h3><div id="log" class="log"></div></div>
<script>
const K='terranova_web_02';let s=JSON.parse(localStorage.getItem(K))||{credits:1000,oxy:5,water:8,temp:-35,pop:10,power:50,buildings:{extractor:0,solar:0,greenhouse:0,habitat:0},turn:1};
const cost={extractor:300,solar:250,greenhouse:450,habitat:600};
function save(){localStorage.setItem(K,JSON.stringify(s));render()}function msg(x){log.innerHTML='• '+x+'<br>'+log.innerHTML}
function build(t){if(s.credits<cost[t])return msg('❌ الرصيد غير كافٍ.');s.credits-=cost[t];s.buildings[t]++;if(t==='extractor'){s.water=Math.min(100,s.water+4);s.power-=5}if(t==='solar')s.power+=20;if(t==='greenhouse'){s.oxy=Math.min(100,s.oxy+3);s.water=Math.max(0,s.water-2)}if(t==='habitat'){s.pop+=8;s.power-=8}msg('✅ تم البناء.');save()}
function advance(){s.turn++;s.credits+=70+s.pop*2;s.water+=s.buildings.extractor*2;s.oxy+=s.buildings.greenhouse;s.temp+=s.oxy>20?1:.2;s.power+=s.buildings.solar*4-s.pop*.15;if(s.water>25&&s.oxy>15)s.pop+=Math.floor(s.pop*.03);s.water=Math.min(100,Math.max(0,s.water));s.oxy=Math.min(100,Math.max(0,s.oxy));msg('⏱️ انتهت الدورة '+s.turn);save()}
function resetGame(){if(confirm('بدء لعبة جديدة؟')){localStorage.removeItem(K);location.reload()}}
function render(){credits.textContent=Math.floor(s.credits);oxy.textContent=Math.floor(s.oxy)+'%';water.textContent=Math.floor(s.water)+'%';temp.textContent=Math.floor(s.temp)+'°C';pop.textContent=Math.floor(s.pop);power.textContent=Math.floor(s.power)}render();msg('🎯 ارفع الأكسجين والمياه وابدأ أول مستعمرة.');
</script></body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TerraNova</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#07111f;color:#eaf6ff;font-family:Arial,sans-serif}
#app{max-width:700px;margin:auto;min-height:100vh;padding:14px}
h1{margin:5px 0;font-size:28px}.sub{color:#8fb0c9;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.card{background:#102235;border:1px solid #1e3a52;border-radius:14px;padding:10px;text-align:center}
.big{font-size:22px;font-weight:bold}.label{font-size:11px;color:#91abc0}
.planet{height:260px;border-radius:50%;margin:18px auto;width:260px;
background:radial-gradient(circle at 35% 30%,#6bd6ff 0 9%,transparent 10%),
radial-gradient(circle at 60% 62%,#48a878 0 14%,transparent 15%),
radial-gradient(circle at 30% 70%,#388f68 0 10%,transparent 11%),
radial-gradient(circle at 65% 30%,#72c47a 0 8%,transparent 9%),
radial-gradient(circle at 50% 50%,#1870a0,#0a3658 60%,#041522 75%);
box-shadow:0 0 45px #2a9dca88, inset -25px -15px 45px #00101e}
button{width:100%;padding:14px;margin:5px 0;border:0;border-radius:12px;background:#1d8f72;color:white;font-size:16px;font-weight:bold}
button:disabled{opacity:.4}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.log{background:#081725;border-radius:12px;padding:10px;height:95px;overflow:auto;font-size:12px;color:#b9d2e2}
</style>
</head>
<body>
<div id="app">
<h1>🌍 TerraNova</h1>
<div class="sub">النسخة التجريبية 0.1 — ابدأ بتحويل كوكب ميت إلى عالم صالح للحياة</div>

<div class="stats">
 <div class="card"><div id="credits" class="big">1000</div><div class="label">💰 الرصيد</div></div>
 <div class="card"><div id="oxy" class="big">5%</div><div class="label">🫁 الأكسجين</div></div>
 <div class="card"><div id="pop" class="big">10</div><div class="label">👨‍🚀 السكان</div></div>
</div>

<div class="planet"></div>

<div class="stats">
 <div class="card"><div id="water" class="big">8%</div><div class="label">💧 المياه</div></div>
 <div class="card"><div id="temp" class="big">-35°C</div><div class="label">🌡️ الحرارة</div></div>
 <div class="card"><div id="power" class="big">50</div><div class="label">⚡ الطاقة</div></div>
</div>

<div class="row">
<button onclick="build('extractor')">💧 بناء مستخرج مياه<br><small>300 💰</small></button>
<button onclick="build('solar')">☀️ بناء محطة شمسية<br><small>250 💰</small></button>
<button onclick="build('greenhouse')">🌱 بناء بيت زراعي<br><small>450 💰</small></button>
<button onclick="build('habitat')">🏠 بناء مستعمرة<br><small>600 💰</small></button>
</div>

<button onclick="advance()">⏩ تسريع دورة الكوكب</button>
<h3>سجل المهمة</h3><div id="log" class="log"></div>
</div>

<script>
let s=JSON.parse(localStorage.getItem('terraNova'))||{
credits:1000,oxy:5,water:8,temp:-35,pop:10,power:50,
buildings:{extractor:0,solar:0,greenhouse:0,habitat:0},turn:1};

const cost={extractor:300,solar:250,greenhouse:450,habitat:600};
function save(){localStorage.setItem('terraNova',JSON.stringify(s));render();}
function msg(x){let l=document.getElementById('log');l.innerHTML='• '+x+'<br>'+l.innerHTML;}
function build(type){
 if(s.credits<cost[type]){msg('الرصيد غير كافٍ.');return}
 s.credits-=cost[type]; s.buildings[type]++;
 if(type==='extractor'){s.water=Math.min(100,s.water+4);s.power-=5}
 if(type==='solar'){s.power+=20}
 if(type==='greenhouse'){s.oxy=Math.min(100,s.oxy+3);s.water-=2}
 if(type==='habitat'){s.pop+=8;s.power-=8}
 msg('تم بناء '+type+' بنجاح.');
 save();
}
function advance(){
 s.turn++;
 s.credits += 70 + s.pop*2;
 s.water += s.buildings.extractor*2;
 s.oxy += s.buildings.greenhouse;
 s.temp += s.oxy>20 ? 1 : 0.2;
 s.power += s.buildings.solar*4 - s.pop*0.15;
 if(s.water>25 && s.oxy>15) s.pop += Math.floor(s.pop*0.03);
 s.water=Math.min(100,Math.max(0,s.water));
 s.oxy=Math.min(100,Math.max(0,s.oxy));
 msg('انتهت الدورة '+s.turn+' — حصلت على موارد جديدة.');
 save();
}
function render(){
 credits.textContent=Math.floor(s.credits);
 oxy.textContent=Math.floor(s.oxy)+'%';
 water.textContent=Math.floor(s.water)+'%';
 temp.textContent=Math.floor(s.temp)+'°C';
 pop.textContent=Math.floor(s.pop);
 power.textContent=Math.floor(s.power);
}
render();msg('المهمة الأولى: ارفع الأكسجين والمياه وابدأ أول مستعمرة.');
</script>
</body></html>

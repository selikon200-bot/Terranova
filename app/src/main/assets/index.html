<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TerraNova Test</title>
    <style>
        body {
            margin: 0;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 32px;
        }

        p {
            color: #9ec3d8;
        }

        button {
            width: 100%;
            max-width: 350px;
            padding: 16px;
            border: 0;
            border-radius: 14px;
            background: #1d8f72;
            color: white;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>🌍 TerraNova</h1>

    <p>التطبيق يعمل بنجاح ✅</p>

    <button onclick="test()">
        اختبار اللعبة
    </button>

    <script>
        function test() {
            document.querySelector("p").textContent =
                "JavaScript يعمل بنجاح 🎮";
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraNova</title>

<style>
body{
    margin:0;
    background:#07111f;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

#app{
    max-width:600px;
    margin:auto;
    padding:20px;
}

.card{
    background:#102235;
    border-radius:15px;
    padding:15px;
    margin:10px 0;
}

button{
    width:100%;
    padding:18px;
    margin:6px 0;
    border:0;
    border-radius:12px;
    background:#1d8f72;
    color:white;
    font-size:16px;
    font-weight:bold;
}

#planet{
    width:220px;
    height:220px;
    margin:25px auto;
    border-radius:50%;

    background:
    radial-gradient(circle at 35% 30%,#6bd6ff 0 8%,transparent 9%),
    radial-gradient(circle at 60% 62%,#48a878 0 14%,transparent 15%),
    radial-gradient(circle at 50% 50%,#1870a0,#0a3658 60%,#041522 75%);

    box-shadow:0 0 40px #249dcc;
}

#log{
    height:120px;
    overflow:auto;
    text-align:right;
    font-size:13px;
}
</style>
</head>

<body>

<div id="app">

<h1>🌍 TerraNova</h1>

<div class="card">
💰 الرصيد:
<strong id="credits">1000</strong>
</div>

<div class="card">
🔄 الدورة:
<strong id="turn">1</strong>
</div>

<div id="planet"></div>

<button id="testButton">
🧪 اختبار اللعبة
</button>

<button id="waterButton">
💧 بناء مستخرج مياه — 300 💰
</button>

<div class="card">
📜 سجل اللعبة

<div id="log"></div>
</div>

</div>

<script>

var credits = 1000;

var turn = 1;


function logMessage(message){

    var log = document.getElementById("log");

    log.innerHTML =
        "• " + message +
        "<br>" +
        log.innerHTML;
}


function testGame(){

    credits += 100;

    document.getElementById("credits").innerText =
        credits;

    logMessage("✅ الزر يعمل بنجاح!");

}


function buildWater(){

    if(credits < 300){

        logMessage("❌ لا يوجد رصيد كافٍ.");

        return;
    }

    credits -= 300;

    document.getElementById("credits").innerText =
        credits;

    logMessage("💧 تم بناء مستخرج مياه.");

}


function automaticTurn(){

    turn++;

    credits += 100;

    document.getElementById("turn").innerText =
        turn;

    document.getElementById("credits").innerText =
        credits;

    logMessage(
        "🔄 دورة جديدة رقم " +
        turn
    );

}


document
.getElementById("testButton")
.addEventListener(
    "click",
    testGame
);


document
.getElementById("waterButton")
.addEventListener(
    "click",
    buildWater
);


logMessage(
    "🚀 TerraNova تعمل."
);


setInterval(
    automaticTurn,
    5000
);

</script>

</body>
</html>

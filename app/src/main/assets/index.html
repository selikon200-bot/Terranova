* {

body {

#app {

.header {
    text-align: center;
    padding: 8px 0 12px;

    margin: 0;
    font-size: 28px;

.header p {
    margin: 5px 0 0;
    color: #91abc0;
    font-size: 12px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 9px;
}

.card {
    background: rgba(16,34,53,.95);
    border: 1px solid #1e3a52;

    padding: 10px 4px;
    text-align: center;
}

.value {
    font-size: 19px;
    font-weight: bold;
}

.label {
    margin-top: 4px;
    color: #91abc0;
    font-size: 10px;
}
